    Content: >
      ### 👋 Welcome to my blog!


      My name is Dmitry. I am a software engineer with more then 5 years of experience.


      Here, you’ll find a mix of content — from deep dives into software design and architecture, to reflections on industry trends, to the occasional dev log where I’ll document the progress (and challenges) of my personal and pet projects. Whether it’s a new framework I’m exploring, an engineering problem I’m puzzling over, or lessons learned from past experiences, this blog is my way of thinking out loud and connecting with others who share a passion for building things.
      

      If you’re an engineer, a tech enthusiast, or just curious about the craft behind the code, I hope you’ll find something here that sparks your interest.

